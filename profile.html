<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · KIIZU</title><link rel="stylesheet" href="css/global.css"></head>
<body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html"><span class="brand-mark">K</span> KIIZU</a><nav class="main-nav"><a href="lobby.html">Hub</a><a href="discover.html">Descubrir</a><a href="shop.html">Tienda</a><a href="inventory.html">Inventario</a><a class="active" href="profile.html">Perfil</a></nav><div class="user-pill">🪙 <span data-coins>0</span><button data-signout>↪</button></div></header>
<section class="profile-hero"><div class="profile-avatar"><div class="avatar avatar-main"><i></i><b></b></div></div><div><span class="eyebrow">PLAYER PROFILE</span><h1 data-username>Cargando...</h1><p>Level <strong id="level">1</strong> · <span id="xp">Cargando...</span> XP</p><div class="xpbar"><i id="xpbar"></i></div></div><a class="button button--ghost" href="inventory.html">Personalizar</a></section>
<section class="stats"><div><b id="wins">Cargando...</b><small>Victorias</small></div><div><b id="losses">Cargando...</b><small>Derrotas</small></div><div><b id="games">Cargando...</b><small>Partidas</small></div><div><b id="coins">Cargando...</b><small>Coins</small></div></section>
<section class="section-head"><div><span class="eyebrow">PROGRESSION</span><h2>Achievements</h2></div></section><div id="achievements" class="achievement-grid"></div>
</main><script type="module">import { bootShell } from "./js/nav.js"; import { supabase } from "./js/app.js"; import { toast } from "./js/ui.js"; const s=await bootShell(); if(s){document.querySelector("#level").textContent=s.profile.level??1;document.querySelector("#xp").textContent=(s.profile.xp??0).toLocaleString();document.querySelector("#wins").textContent=s.profile.wins??0;document.querySelector("#losses").textContent=s.profile.losses??0;document.querySelector("#games").textContent=s.profile.games_played??0;document.querySelector("#coins").textContent=Number(s.profile.coins??0).toLocaleString();document.querySelector("#xpbar").style.width=Math.min(100,(s.profile.xp??0)%100)+"%";try{const{data,error}=await supabase.from("user_achievements").select("unlocked_at,achievements(name,description,icon,xp_reward)").eq("user_id",s.session.user.id).order("unlocked_at",{ascending:false});if(error)throw error;const box=document.querySelector("#achievements");box.innerHTML=data?.length?data.map(x=>"<article class=\"achievement\"><span>"+x.achievements.icon+"</span><div><b>"+x.achievements.name+"</b><small>"+x.achievements.description+"</small></div></article>").join(""):"<div class=\"empty-state\"><h3>Todavía no hay logros desbloqueados.</h3><p>Juega y completa objetivos para conseguirlos.</p></div>"}catch(e){toast("No se pudieron cargar los logros.","error")}}</script></body></html>
