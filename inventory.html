<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario · KIIZU</title><link rel="stylesheet" href="css/global.css"></head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html"><span class="brand-mark">K</span> KIIZU</a><nav class="main-nav"><a href="lobby.html">Hub</a><a href="discover.html">Descubrir</a><a href="shop.html">Tienda</a><a class="active" href="inventory.html">Inventario</a><a href="profile.html">Perfil</a></nav><div class="user-pill">🪙 <span data-coins>0</span><button data-signout>↪</button></div></header><section class="page-heading"><span class="eyebrow">INVENTORY</span><h1>Tu colección.</h1><p>Todo lo que desbloqueas permanece contigo.</p></section><div class="filter-row"><span class="chip active">Todos</span><span class="chip">Ropa</span><span class="chip">Accesorios</span><span class="chip">Emotes</span><span class="chip">Efectos</span></div><section id="inventory-grid" class="item-grid"><div class="empty-state"><span>◇</span><h3>Tu inventario está esperando.</h3><p>Visita la tienda para conseguir tu primer objeto.</p><a class="button button--small" href="shop.html">Ir a la tienda</a></div></section></main><script type="module">import { bootShell } from "./js/nav.js"; import { supabase } from "./js/app.js"; const s=await bootShell(); if(s){const {data}=await supabase.from("inventory").select("item_id, items(*)").eq("user_id",s.session.user.id);const g=document.querySelector("#inventory-grid");if(data?.length)g.innerHTML=data.map(x=>`<article class="item-card"><div class="item-art">✦</div><div><span class="eyebrow">${x.items.category}</span><h3>${x.items.name}</h3><p>Adquirido</p></div><button class="button button--small" disabled>Equipar</button></article>`).join("")}</script></body></html>
