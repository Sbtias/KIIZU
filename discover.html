<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugar · KIIZU</title><link rel="stylesheet" href="css/global.css"></head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html">KIIZU</a><nav class="main-nav"><a href="lobby.html">Inicio</a><a class="active" href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a href="creator.html">Ropa</a><a href="game-creator.html">Crear juego</a></nav><div class="user-pill"></div></header><section class="page-heading"><span class="eyebrow">JUEGOS</span><h1>Juega.</h1><p>Encuentra algo que jugar.</p></section><section id="games-grid" class="discover-grid"><div class="empty-state"><h3>Cargando juegos...</h3></div></section></main><script type="module">import{bootShell}from"./js/nav.js?v=20260918-1335";import{supabase}from"./js/app.js";import{toast}from"./js/ui.js";const state=await bootShell(),g=document.querySelector("#games-grid"),safe=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));try{const{data,error}=await supabase.from("games").select("id,slug,name,description,min_players,max_players,is_published,creator_rating,creator_id,thumbnail_url,created_at,profiles!games_creator_id_fkey(username)").eq("is_published",true).order("created_at",{ascending:false});if(error)throw error;if(!data?.length){g.innerHTML="<div class=\"empty-state\"><h3>No hay juegos todavía.</h3><p>Cuando la comunidad publique juegos aparecerán aquí.</p></div>"}else{g.innerHTML=data.map(x=>{const img=x.thumbnail_url?'<img src="'+safe(x.thumbnail_url)+'" alt="">':'<div class="discover-art">KIIZU</div>';const creator=x.profiles?.username||"Creador";const rate=Number(x.creator_rating||0);const controls=state?.profile?.username?.toLowerCase()==="sbtias"?'<select class="creator-rate" data-id="'+x.id+'"><option value="">Rate</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(n===rate?'selected':'')+'>'+n+' / 5</option>').join("")+'</select>':"";return '<article class="discover-card">'+img+'<div class="discover-card-body"><span class="eyebrow">por '+safe(creator)+'</span><h3>'+safe(x.name)+'</h3><p>'+safe(x.description||"Sin descripción")+'</p><small>'+x.min_players+'–'+x.max_players+' jugadores · Creador '+rate+'/5</small><div class="tool-row"><a class="button button--small" href="game.html?game='+encodeURIComponent(x.slug)+'">Jugar</a>'+controls+'</div></div></article>'}).join("");document.querySelectorAll(".creator-rate").forEach(s=>s.addEventListener("change",async e=>{if(!e.target.value)return;const{error}=await supabase.rpc("rate_game_by_creator",{p_game_id:e.target.dataset.id,p_rating:Number(e.target.value)});if(error)toast(error.message,"error");else toast("Rate de creador guardado.","success")}))}}catch(e){g.innerHTML="<div class=\"empty-state\"><h3>No se pudieron cargar los juegos.</h3><p>Comprueba tu conexión e inténtalo de nuevo.</p></div>";toast(e.message||"No se pudieron cargar los juegos.","error")}</script><script src="js/ui-sound.js?v=20260918-1340"></script></body></html>
