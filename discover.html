<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugar · KIIZU</title><link rel="stylesheet" href="css/global.css"></head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html"><span class="brand-mark">K</span> KIIZU</a><nav class="main-nav"><a class="active" href="discover.html">Jugar</a><a href="lobby.html">Inicio</a><a href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a href="creator.html">Ropa</a><a href="game-creator.html">Crear juego</a></nav><div class="user-pill"></div></header><section class="page-heading"><span class="eyebrow">JUEGOS</span><h1>Juega.</h1><p>Encuentra algo que jugar.</p></section><section id="games-grid" class="discover-grid"><div class="empty-state"><h3>Cargando juegos...</h3></div></section></main><script type="module">import{bootShell}from"./js/nav.js";import{supabase}from"./js/app.js";import{toast}from"./js/ui.js";await bootShell();const g=document.querySelector("#games-grid");const safe=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));try{const{data,error}=await supabase.from("games").select("slug,name,description,min_players,max_players,unlocked_by_default,is_published").or("is_published.eq.true,unlocked_by_default.eq.true").order("created_at");if(error)throw error;if(!data?.length){g.innerHTML="<div class=\"empty-state\"><h3>No hay juegos todavía.</h3><p>Cuando haya juegos disponibles aparecerán aquí.</p></div>"}else{g.innerHTML=data.map(x=>"<article class=\"discover-card\"><div class=\"discover-art\">"+safe(x.name)+"</div><h3>"+safe(x.name)+"</h3><p>"+safe(x.description||"Sin descripción")+"</p><small>"+x.min_players+"–"+x.max_players+" jugadores</small><a class=\"button button--small\" href=\"game.html?game="+encodeURIComponent(x.slug)+"\">Jugar</a></article>").join("")}}catch(e){g.innerHTML="<div class=\"empty-state\"><h3>No se pudieron cargar los juegos.</h3><p>Comprueba tu conexión e inténtalo de nuevo.</p></div>";toast(e.message||"No se pudieron cargar los juegos.","error")}</script><script src="js/ui-sound.js"></script></body></html>
