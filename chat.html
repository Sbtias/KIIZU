<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat · KIIZU</title><link rel="stylesheet" href="css/global.css?v=20260919-0422"><link rel="stylesheet" href="css/kiizu-ui.css?v=20260919-1530"></head>
<body>
<main class="app-shell chat-shell">
  <header class="appbar">
    <a class="brand" href="lobby.html">KIIZU</a>
    <nav class="main-nav"><a href="lobby.html">Inicio</a><a href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a href="clothing-creator.html">Ropa</a><a href="game-creator.html">Crear juego</a></nav>
    <div class="user-pill"></div>
  </header>

  <section class="page-heading chat-page-heading">
    <div>
      <span class="eyebrow">SOCIAL</span>
      <h1>Mensajes.</h1>
      <p>Mensajes con tus amigos.</p>
    </div>
    <a class="button button--ghost" href="friends.html">Gestionar amigos <span>→</span></a>
  </section>

  <section class="chat-layout">
    <aside class="chat-sidebar panel">
      <div class="chat-sidebar-head">
        <div><h2>Chats</h2></div>
        <span id="chat-count" class="chat-count">0</span>
      </div>
      <label class="chat-search">
        <span>⌕</span>
        <input id="chat-search-input" type="search" autocomplete="off" placeholder="Buscar amigo...">
      </label>
      <div class="chat-filters" role="tablist" aria-label="Filtro de conversaciones">
        <button class="chat-filter is-active" data-chat-filter="all" type="button">Todos</button>
        <button class="chat-filter" data-chat-filter="online" type="button">En línea</button>
      </div>
      <div id="chat-friends" class="chat-friend-list" aria-live="polite">
        <div class="chat-loading"><span></span><span></span><span></span></div>
      </div>
    </aside>

    <section class="chat-panel panel">
      <header id="chat-header" class="chat-header">
        <div class="chat-header-empty">
          
          <div><h2>Selecciona un chat</h2><p>Elige un amigo para ver los mensajes.</p></div>
        </div>
      </header>
      <div id="chat-messages" class="chat-messages" aria-live="polite">
        <div class="chat-welcome">
          <div class="chat-welcome-icon">✦</div>
          <h3>Tu espacio privado</h3>
          <p>Selecciona una conversación para empezar a hablar.</p>
        </div>
      </div>
      <form id="chat-form" class="chat-composer">
        <div class="chat-compose-wrap">
          <input id="chat-input" maxlength="500" autocomplete="off" placeholder="Selecciona un amigo para escribir..." disabled>
          <span id="chat-character-count">0/500</span>
        </div>
        <button class="button chat-send" type="submit" disabled><span>Enviar</span><b>↵</b></button>
      </form>
      <div class="chat-compose-note"><span id="chat-storage">0 B / 10 KB</span><span>Solo mensajes de texto</span></div>
    </section>
  </section>
</main>
<script type="module" src="js/chat.js?v=20260919-1530"></script>
<script src="js/ui-sound.js?v=20260919-0310"></script>
</body>
</html>
