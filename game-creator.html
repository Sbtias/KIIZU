<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear juego · KIIZU</title><link rel="stylesheet" href="css/global.css"></head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html"><span class="brand-mark">K</span> KIIZU</a><nav class="main-nav"><a href="lobby.html">Inicio</a><a href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a href="creator.html">Ropa</a><a class="active" href="game-creator.html">Crear juego</a><a href="inventory.html">Inventario</a></nav><div class="user-pill"><span data-username>Player</span><b>🪙 <span data-coins>0</span></b><button data-signout>↪</button></div></header><section class="page-heading"><span class="eyebrow">GAME CREATOR</span><h1>Tu juego empieza aquí.</h1><p>Crea una experiencia con una mecánica segura y publicable. Nada de código arbitrario ejecutándose en el navegador.</p></section><section class="panel panel--clean creator-form"><label>Nombre<input id="name" maxlength="60" placeholder="Mi minijuego"></label><label>Descripción<textarea id="description" maxlength="500" rows="4" placeholder="¿De qué trata?"></textarea></label><label>Mecánica<select id="mechanic"><option value="click">Click rápido</option><option value="reaction">Reacción</option><option value="memory">Memoria</option></select></label><label>Jugadores mínimos<input id="min" type="number" min="1" max="8" value="1"></label><label>Jugadores máximos<input id="max" type="number" min="1" max="8" value="8"></label><div class="hero-actions"><button class="button" id="save">Guardar</button><button class="button button--ghost" id="publish">Publicar</button></div><p id="status" class="form-status">Primero guarda tu juego. Publicarlo lo hará visible en Jugar.</p></section></main><script type="module" src="js/game-creator.js"></script></body></html>
