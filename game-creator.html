<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIIZU Studio</title><link rel="stylesheet" href="css/global.css?v=20260919-0422"><link rel="stylesheet" href="css/kiizu-ui.css?v=20260919-0352"><style>
.studio{height:calc(100vh - 108px);min-height:680px;display:grid;grid-template-columns:215px minmax(0,1fr) 285px;gap:10px}.studio-side,.studio-inspector{display:flex;flex-direction:column;gap:10px;min-height:0}.studio-card{padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(12,15,19,.76);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 45px rgba(0,0,0,.16)}.studio-card h3{margin:0 0 10px;font:700 12px "Space Grotesk"}.studio-card p{margin:0 0 9px;color:var(--muted);font-size:9px;line-height:1.5}.tool-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}.tool-tab{padding:7px 5px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(255,255,255,.03);color:var(--muted);font-size:9px}.tool-tab.active{color:var(--text);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:365px;overflow:auto}.studio-tool{min-height:55px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.025);color:var(--text);padding:7px;text-align:left}.studio-tool.active{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}.studio-tool b{display:block;font-size:14px;margin-bottom:2px}.studio-tool span{display:block;color:var(--muted);font-size:8px}.studio-stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:7px}.studio-toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 9px;border:1px solid rgba(255,255,255,.11);border-radius:12px;background:rgba(12,15,19,.76);backdrop-filter:blur(18px)}.toolbar-group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.toolbar-btn{min-height:30px;padding:6px 9px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(255,255,255,.035);color:var(--muted);font-size:9px}.toolbar-btn.active,.toolbar-btn:hover{color:var(--text);background:rgba(255,255,255,.09)}.studio-canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:#080a0d}.studio-canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}.canvas-help{position:absolute;left:10px;bottom:9px;padding:6px 8px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(4,6,8,.75);color:#7c858f;font-size:8px;pointer-events:none}.studio-title{padding:11px 0 9px}.studio-title h1{margin:2px 0 0;font:700 22px "Space Grotesk";letter-spacing:-.04em}.studio-title p{margin:3px 0 0;color:var(--muted);font-size:9px}.fields{display:grid;gap:8px}.fields label{display:grid;gap:4px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em}.fields input,.fields textarea,.fields select{margin:0;padding:8px;font-size:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.inspector-empty{color:var(--muted);font-size:9px;line-height:1.5}.object-list{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:170px}.object-row{display:flex;justify-content:space-between;gap:5px;padding:7px;border:1px solid rgba(255,255,255,.06);border-radius:7px;background:rgba(255,255,255,.025);font-size:8px}.object-row.selected{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.17)}.object-row button{border:0;background:none;color:#8a929b}.achievement-list{display:grid;gap:6px;max-height:180px;overflow:auto;margin-top:8px}.achievement-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.025)}.achievement-row>span{font-size:18px;text-align:center}.achievement-row strong,.achievement-row small{display:block}.achievement-row strong{font-size:9px}.achievement-row small{font-size:8px;color:var(--muted);margin-top:2px}.achievement-row>b{font-size:8px;white-space:nowrap}.badges{display:flex;gap:4px;flex-wrap:wrap}.badge{padding:4px 6px;border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#7d8791;font-size:7px;text-transform:uppercase}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}.actions .button{padding:8px;font-size:9px}.status{grid-column:1/-1;min-height:20px;color:var(--muted);font-size:9px}.section-scroll{min-height:0;overflow:auto}.danger{color:#bd858c!important}@media(max-width:1100px){.studio{grid-template-columns:190px minmax(0,1fr)}.studio-inspector{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.actions{margin-top:0}}@media(max-width:700px){.studio{height:auto;grid-template-columns:1fr}.studio-stage{height:600px}.studio-inspector{display:flex}.studio-side{display:flex}.tool-grid{grid-template-columns:repeat(4,1fr);max-height:none}.studio-tool{min-height:48px}.studio-tool span{display:none}.studio-title h1{font-size:19px}}
</head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html">KIIZU</a><nav class="main-nav"><a href="lobby.html">Inicio</a><a href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a href="creator.html">Creador</a></nav><div class="user-pill"></div></header><div class="studio-title"><span class="eyebrow">KIIZU STUDIO · 2D</span><h1>Tu mundo. Tus reglas.</h1><p>Empieza con una plantilla o construye desde cero. Haz clic para colocar y arrastra para mover.</p></div><section class="panel studio-my-games"><div><span class="eyebrow">MIS JUEGOS</span><h2>Mis minijuegos</h2><p>Administra tus proyectos y elimina los que ya no quieras.</p></div><div id="my-games" class="my-games-list"><span class="status">Cargando tus juegos...</span></div></section><section class="studio"><aside class="studio-side"><div class="studio-card"><h3>Editor</h3><div class="tool-tabs"><button class="tool-tab active" data-tab="objects">Objetos</button><button class="tool-tab" data-tab="world">Mundo</button></div>
<div class="studio-templates">
  <span class="eyebrow">PLANTILLAS</span>
  <div class="template-row">
    <button class="button button--small button--ghost" type="button" data-template="obby">Obby</button>
    <button class="button button--small button--ghost" type="button" data-template="coins">Monedas</button>
    <button class="button button--small button--ghost" type="button" data-template="arena">Arena</button>
    <button class="button button--small button--ghost" type="button" data-template="empty">Vacío</button>
  </div>
</div><div id="objects-panel"><div class="tool-grid"><button class="studio-tool active" data-tool="select"><b>↖</b><span>Seleccionar</span></button><button class="studio-tool" data-tool="spawn"><b>◉</b><span>Aparecer</span></button><button class="studio-tool" data-tool="platform"><b>▬</b><span>Plataforma</span></button><button class="studio-tool" data-tool="hazard"><b>△</b><span>Obstáculo</span></button><button class="studio-tool" data-tool="enemy"><b>◆</b><span>Enemigo</span></button><button class="studio-tool" data-tool="checkpoint"><b>◇</b><span>Checkpoint</span></button><button class="studio-tool" data-tool="spring"><b>↑</b><span>Impulso</span></button><button class="studio-tool" data-tool="moving"><b>↔</b><span>Móvil</span></button><button class="studio-tool" data-tool="coin"><b>●</b><span>Moneda</span></button><button class="studio-tool" data-tool="goal"><b>◎</b><span>Meta</span></button><button class="studio-tool" data-tool="water"><b>≈</b><span>Agua</span></button><button class="studio-tool" data-tool="tree"><b>♣</b><span>Árbol</span></button><button class="studio-tool" data-tool="rock"><b>◆</b><span>Roca</span></button><button class="studio-tool" data-tool="erase"><b>⌫</b><span>Borrar</span></button></div></div><div id="world-panel" hidden class="fields"><label>Ancho del mundo<input id="world-width" type="number" min="1200" max="10000" step="100" value="3600"></label><label>Alto del mundo<input id="world-height" type="number" min="600" max="2500" step="100" value="900"></label><label>Gravedad<input id="gravity" type="number" min=".2" max="1.5" step=".05" value=".72"></label><label>Fondo<select id="background"><option value="night">Noche</option><option value="dusk">Atardecer</option><option value="forest">Bosque</option><option value="cave">Cueva</option></select></label><button class="button button--ghost button--full" id="apply-world">Aplicar mundo</button></div></div><div class="studio-card"><h3>Atajos</h3><p>Selecciona y arrastra. Rueda = zoom. Espacio + arrastrar = mover cámara. Supr = borrar. Coloca un solo punto de aparición para controlar el inicio.</p><button class="button button--ghost button--full" id="reset-world">Vaciar mapa</button></div></aside><section class="studio-stage"><div class="studio-toolbar"><div class="toolbar-group"><button class="toolbar-btn" id="zoom-out">−</button><button class="toolbar-btn" id="zoom-reset">100%</button><button class="toolbar-btn" id="zoom-in">+</button><button class="toolbar-btn active" id="grid-toggle">Cuadrícula</button><button class="toolbar-btn" id="test-game">▶ Probar</button></div><div class="badges"><span class="badge" id="object-count">0 objetos</span><span class="badge">2D</span><span class="badge">Auto-snap</span></div></div><div class="studio-canvas-wrap"><canvas id="studio-canvas"></canvas><div class="canvas-help">Click coloca · arrastra mueve · rueda zoom · espacio + arrastra cámara</div></div></section><aside class="studio-inspector"><div class="studio-card"><h3>Tu juego</h3><div class="fields"><label>Nombre<input id="name" maxlength="60" placeholder="Mi obra maestra"></label><label>Descripción<textarea id="description" rows="2" maxlength="500" placeholder="Describe tu juego"></textarea></label><label>Imagen del juego<input id="game-image" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="row2"><label>Jugadores<input id="max" type="number" min="1" max="8" value="8"></label><label>Tiempo<input id="time" type="number" min="20" max="900" value="180"></label></div><label>Objetivo<input id="objective" maxlength="100" value="Llega a la meta"></label></div></div><div class="studio-card section-scroll"><h3>Inspector</h3><div id="inspector" class="inspector-empty">Selecciona un objeto para editar su posición, tamaño y propiedades.</div></div><div class="studio-card"><h3>Logros</h3><div class="fields"><label>Icono<input id="achievement-icon" maxlength="4" value="🏆"></label><label>Nombre<input id="achievement-name" maxlength="60" placeholder="Primer paso"></label><label>Descripción<input id="achievement-description" maxlength="160" placeholder="Completa este juego"></label><label>XP<input id="achievement-xp" type="number" min="1" max="500" value="10"></label><button class="button button--ghost button--full" id="create-achievement">Crear logro</button><div id="achievement-status" class="status"></div><div id="achievement-list" class="achievement-list"></div></div></div><div class="studio-card"><h3>Objetos del mapa</h3><div id="object-list" class="object-list"></div></div><div class="studio-card actions"><button class="button" id="save">Guardar</button><button class="button button--ghost" id="publish">Publicar</button><button class="button button--ghost danger" id="delete-game" hidden>Eliminar juego</button><div id="status" class="status"></div></div></aside></section></main><script type="module" src="js/game-creator.js?v=20260919-0402"></script><script src="js/ui-sound.js?v=20260919-0310"></script></body></html>
