<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear ropa · KIIZU</title><link rel="stylesheet" href="css/global.css"></head><body><main class="app-shell"><header class="appbar"><a class="brand" href="lobby.html">KIIZU</a><nav class="main-nav"><a href="lobby.html">Inicio</a><a href="discover.html">Jugar</a><a href="shop.html">Marketplace</a><a class="active" href="creator.html">Ropa</a><a href="game-creator.html">Crear juego</a></nav><div class="user-pill"></div></header><section class="page-heading"><span class="eyebrow">CREAR ROPA</span><h1>Diseña tu prenda.</h1><p>Usa el editor para crear una prenda y decidir cuándo publicarla.</p></section><section class="creator-layout"><aside class="creator-tools panel"><label>Prenda<select id="type"><option value="camiseta">Camiseta</option><option value="camisa">Camisa</option><option value="pantalon">Pantalón</option><option value="sudadera">Sudadera</option><option value="gorra">Gorra</option><option value="accesorio">Accesorio</option></select></label><label>Color<input id="color" type="color" value="#111111"></label><div class="tool-row"><button class="button button--small" id="brush">Pincel</button><button class="button button--small button--ghost" id="eraser">Borrador</button><button class="button button--small button--ghost" id="fill">Relleno</button></div><div class="tool-row"><button class="button button--small button--ghost" id="rect">Rectángulo</button><button class="button button--small button--ghost" id="circle">Círculo</button><button class="button button--small button--ghost" id="text">Texto</button></div><div class="tool-row"><button class="button button--small button--ghost" id="undo">Deshacer</button><button class="button button--small button--ghost" id="clear">Limpiar</button></div><label>Nombre<input id="name" maxlength="60" placeholder="Mi diseño"></label><label>Descripción<textarea id="description" maxlength="500" rows="4" placeholder="Describe tu creación"></textarea></label><label>Precio en Coins<input id="price" type="number" min="0" max="100000" value="0"></label><div class="tool-row"><button class="button button--small" id="save">Guardar</button><button class="button button--small button--ghost" id="publish">Publicar</button><button class="button button--small button--ghost danger" id="delete-creation" hidden>Eliminar</button></div><p id="creator-status" class="form-status">Guarda tus cambios antes de publicar.</p></aside><section class="creator-canvas panel"><div class="canvas-head"><span class="eyebrow">EDITOR</span><span id="zoom-label">100%</span></div><div class="canvas-wrap"><canvas id="design" width="640" height="640" aria-label="Lienzo de diseño"></canvas></div><div class="canvas-foot"><button class="button button--small button--ghost" id="zoom-out">−</button><button class="button button--small button--ghost" id="zoom-in">+</button><span>Arrastra para dibujar.</span></div></section></section></main><script type="module" src="js/creator.js?v=20260918-delete1"></script><script src="js/ui-sound.js?v=20260918-1340"></script></body></html>
